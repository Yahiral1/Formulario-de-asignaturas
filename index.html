<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Notas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 30px;
            color: #333;
        }

        h1, h2 {
            text-align: center;
            color: #1e3a5f;
        }

        form {
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            background-color: #1e3a5f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #315b8a;
        }

        table {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #1e3a5f;
            color: white;
        }

        #mensaje {
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Registro de Notas</h1>

    <form id="formulario">

        <label for="asignatura">Asignatura:</label>

        <select id="asignatura" required>
            <option value="">Selecciona una asignatura</option>
            <option value="Matemáticas">Matemáticas</option>
            <option value="Programación">Programación</option>
            <option value="Física">Física</option>
            <option value="Inglés">Inglés</option>
        </select>

        <label for="nota">Nota (0 a 100):</label>

        <input
            type="number"
            id="nota"
            min="0"
            max="100"
            step="0.01"
            required
        >

        <button type="submit">Agregar registro</button>

    </form>

    <p id="mensaje"></p>

    <h2>Tabla de registros</h2>

    <table>
        <thead>
            <tr>
                <th>N.º</th>
                <th>Asignatura</th>
                <th>Nota</th>
                <th>Resultado</th>
            </tr>
        </thead>

        <tbody id="tablaRegistros"></tbody>
    </table>

    <script>
        const formulario = document.getElementById("formulario");
        const asignatura = document.getElementById("asignatura");
        const nota = document.getElementById("nota");
        const tabla = document.getElementById("tablaRegistros");
        const mensaje = document.getElementById("mensaje");

        let contador = 0;

        formulario.addEventListener("submit", function(event) {

            event.preventDefault();

            const nombreAsignatura = asignatura.value;
            const valorNota = nota.value.trim();
            const numeroNota = Number(valorNota);

            // Validar los datos
            if (nombreAsignatura === "" || valorNota === "") {
                mensaje.textContent = "Debes completar todos los campos.";
                mensaje.style.color = "red";
                return;
            }

            if (!Number.isFinite(numeroNota) ||
                numeroNota < 0 ||
                numeroNota > 100) {

                mensaje.textContent = "La nota debe estar entre 0 y 100.";
                mensaje.style.color = "red";
                return;
            }

            // Determinar si aprobó o reprobó
            let resultado;

            if (numeroNota >= 51) {
                resultado = "Aprobado";
            } else {
                resultado = "Reprobado";
            }

            // Crear una nueva fila
            contador++;

            const fila = document.createElement("tr");

            const celdaNumero = document.createElement("td");
            const celdaAsignatura = document.createElement("td");
            const celdaNota = document.createElement("td");
            const celdaResultado = document.createElement("td");

            celdaNumero.textContent = contador;
            celdaAsignatura.textContent = nombreAsignatura;
            celdaNota.textContent = numeroNota;
            celdaResultado.textContent = resultado;

            fila.appendChild(celdaNumero);
            fila.appendChild(celdaAsignatura);
            fila.appendChild(celdaNota);
            fila.appendChild(celdaResultado);

            tabla.appendChild(fila);

            // Mostrar confirmación
            mensaje.textContent = "¡Registro agregado correctamente!";
            mensaje.style.color = "green";

            // Limpiar el formulario
            formulario.reset();
        });
    </script>

</body>
</html>
